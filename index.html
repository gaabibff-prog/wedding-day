<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wedding Day">
<title>Gabi Wedding Day</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=2">
<link rel="icon" href="icons/icon-192.png?v=2">
<style>
:root{--bg:#fff;--soft:#f6f7f9;--card:#fff;--ink:#2b2f33;--mute:#7a8088;--line:#eceef0;--dark:#2f3439;--accent:#9a7a45;--tint:#eef2f6;--ok:#4d6b45;--okbg:#e9f0e6;--now:#fbf4e6;--warn:#b4432f;--icon:#8a94a3}
@media (prefers-color-scheme:dark){:root{--bg:#141516;--soft:#1c1e20;--card:#1c1e20;--ink:#eef0f2;--mute:#9aa1a9;--line:#2b2e31;--dark:#eef0f2;--accent:#d2b07a;--tint:#22272d;--ok:#9cc48f;--okbg:#22301f;--now:#2d271b;--warn:#e88a73;--icon:#9aa3b0}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;display:flex;align-items:center;gap:6px;min-height:56px}
.bar .ttl{flex:1;min-width:0;font-size:19px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:0;background:transparent;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;color:var(--ink)}
.ib svg,.tab svg,.ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{padding:16px 18px calc(env(safe-area-inset-bottom) + 110px);max-width:720px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
.tab{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12.5px;color:var(--mute)}
.tab .ti{width:46px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--icon)}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}.tab[aria-current="page"] .ti{background:var(--tint);color:var(--ink)}
h1.big{font-size:34px;line-height:1.15;margin:4px 0 14px;letter-spacing:-.01em}
h1.hello{font-size:28px;margin:10px 0 2px;letter-spacing:-.01em}
.h2{font-size:21px;font-weight:700;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.h2 .lk{margin-left:auto;font-size:16px;font-weight:500;color:var(--mute);border:0;background:none}
.meta{display:flex;align-items:center;gap:10px;color:var(--mute);margin:6px 0}.meta svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
.sub{color:var(--mute);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.tint{background:var(--tint);border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:16px 0}
.two>div,.two>a{display:flex;gap:12px;align-items:center;padding:16px 4px;color:inherit;text-decoration:none}.two>*+*{border-left:1px solid var(--line);padding-left:16px}
.two b{display:block;font-size:18px}.two small{color:var(--mute);font-size:14px}
.ico{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:18px}
.grid>button{display:flex;gap:12px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:16px 0}
.grid b{display:block;font-size:18px}.grid small{color:var(--mute);font-size:14px}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px}
.li{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:none;padding:16px 18px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.li:last-child{border-bottom:0}.li .t{flex:1;min-width:0}.li b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li small{display:block;color:var(--mute);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .wrap b,.li .wrap small{white-space:normal}
.chev{color:var(--mute);font-size:22px;line-height:1}
.num{flex:0 0 40px;height:40px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:15px;font-weight:600;background:transparent}
.done .num{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.li.done b{text-decoration:line-through;opacity:.6}
.li.now{background:var(--now)}
.seg{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:4px 0 6px}
.seg button{border:0;background:none;padding:10px 0 12px;color:var(--mute);font-size:16px;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.seg button[aria-current="page"]{color:var(--ink);font-weight:700;border-color:var(--ink)}
.seg small{font-weight:500;color:var(--mute);margin-left:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:17px;text-decoration:none;color:var(--ink);width:100%}
.btn svg{width:22px;height:22px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.dark{background:var(--dark);border-color:var(--dark);color:var(--bg)}
.btn.link{border:0;background:none;color:var(--mute);font-weight:500}
.btn.dg{color:var(--warn)}
.btns{display:grid;gap:10px;margin-top:14px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.stat{display:flex;gap:28px;align-items:flex-end;margin:18px 0}.stat b{display:block;font-size:34px;font-weight:500;line-height:1}.stat small{color:var(--mute)}
.glance{display:grid;grid-template-columns:80px 18px 1fr;row-gap:22px;margin-top:14px;align-items:center}
.glance .tm{color:var(--mute);font-size:15px}.glance .dot{width:9px;height:9px;border-radius:50%;background:var(--icon);justify-self:center}
.glance .lb{font-size:18px}
.say{display:block;margin-top:6px;font-size:15px;color:var(--ink);white-space:normal}.say:before{content:"Say: ";font-weight:700;color:var(--accent)}
.thumbs{display:flex;gap:6px;margin-top:8px}.thumbs img{width:58px;height:58px;object-fit:cover;border-radius:10px}
.bigimg img{width:100%;border-radius:14px;margin-top:8px;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;margin:6px -18px 12px;padding:0 18px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14.5px}
.chips button[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:var(--bg)}
.progress{display:flex;justify-content:space-between;align-items:center;color:var(--mute);margin:2px 0 10px}
.bar2{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:-4px 0 14px}.bar2 i{display:block;height:100%;background:var(--ok)}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px;font:inherit;background:var(--card);color:var(--ink)}
textarea{min-height:160px}
.hint{color:var(--mute);font-size:14.5px}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin-left:8px;vertical-align:3px}
.av{width:56px;height:56px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--mute);flex:0 0 auto}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;border-radius:22px 22px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);max-height:85vh;overflow:auto}
.sheet h3{font-size:26px;margin:0;flex:1}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:var(--dark);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:30;font-weight:600;max-width:90vw;text-align:center}
.clock{font-weight:700;font-size:17px;padding-right:6px}
</style>
</head>
<body>
<header id="hd"></header>
<main id="m"><p class="hint">Loading…</p></main>
<nav class="tabs" id="tb"></nav>
<div id="sh"></div>
<input type="file" id="file" hidden>
<script src="app.js"></script>
</body>
</html>
