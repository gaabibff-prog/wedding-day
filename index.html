<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3f4a37">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Wedding Day">
<title>Gabi Wedding Day</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#262626;--mute:#6f6a62;--line:#e6dfd3;--brass:#9a7a45;--ok:#4d6b45;--okbg:#e9f0e6;--now:#f6eedf;--warn:#a1462f;--top:#3f4a37}
@media (prefers-color-scheme:dark){:root{--bg:#171614;--card:#22201d;--ink:#f1ece4;--mute:#a59e92;--line:#3a3631;--brass:#d2b07a;--ok:#9cc48f;--okbg:#26301f;--now:#332b1f;--warn:#e38b72;--top:#22201d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font-size:19px;margin:0;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clock{font-size:22px;font-weight:700;white-space:nowrap}
.back{border:0;background:transparent;color:var(--brass);font:inherit;font-weight:700;font-size:16px;padding:8px 4px 8px 0;min-height:44px}
.sub{color:var(--mute);font-size:13px;margin:2px 0 8px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit;font-size:15px;font-weight:600}
nav button[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding:12px 16px calc(env(safe-area-inset-bottom) + 90px);max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:700}
.row{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.row.done{opacity:.55}.row.done .tx b{text-decoration:line-through}.row.now{background:var(--now);border-color:var(--brass)}
.chk{flex:0 0 44px;height:44px;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:15px}
.row.done .chk{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tx{flex:1;min-width:0;background:transparent;border:0;text-align:left;padding:2px 0;font:inherit;color:inherit}
.tx b{display:block;font-size:16px}.tx small{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.say{display:block;margin-top:6px;font-size:15px}.say:before{content:"Say: ";font-weight:700;color:var(--brass)}
.thumbs{display:flex;gap:6px;margin-top:8px}.thumbs img{width:58px;height:58px;object-fit:cover;border-radius:8px}
.big img{width:100%;border-radius:12px;margin-top:8px;display:block}
.time{flex:0 0 72px;font-weight:700;font-size:15px;padding-top:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;text-decoration:none}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.full{width:100%}
.btn.dg{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#fff}
h2{font-size:15px;margin:18px 0 8px;color:var(--brass)}
.hint{color:var(--mute);font-size:14px}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--card);color:var(--ink)}
textarea{min-height:150px}
.wed{display:block;width:100%;text-align:left;font:inherit;color:inherit}
.wed b{font-size:17px}.badge{display:inline-block;background:var(--brass);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin-left:6px;vertical-align:2px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:9;font-weight:600;max-width:90vw;text-align:center}
</style>
</head>
<body>
<header id="hd"></header>
<main id="m"><p class="hint">Loading…</p></main>
<input type="file" id="file" hidden>
<script src="app.js"></script>
</body>
</html>
